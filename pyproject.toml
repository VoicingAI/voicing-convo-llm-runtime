[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vtext-editor"
version = "1.0.1"
description = "vLLM and SGLang serving plugins: architecture registration, reasoning and tool-call parsers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Voicing AI" }]
keywords = ["vtext", "voicing", "vllm", "sglang", "llm-serving"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately no dependencies: this package is installed *after* an inference
# engine and adapts to whichever one is present. Declaring vllm or sglang here
# would drag in the other, or fight the engine's own pinned versions.
dependencies = []

[project.urls]
Homepage = "https://github.com/VoicingAI/voicing-convo-llm-runtime"
Repository = "https://github.com/VoicingAI/voicing-convo-llm-runtime"
Issues = "https://github.com/VoicingAI/voicing-convo-llm-runtime/issues"

[project.optional-dependencies]
test = ["transformers>=4.40"]

[project.scripts]
voicing-serve = "voicing_runtime.cli:serve"
voicing-check = "voicing_runtime.cli:check"

# Loaded by vLLM in the launcher, engine core and every worker process.
[project.entry-points."vllm.general_plugins"]
voicing_convo = "voicing_runtime.register:register"

# Loaded by SGLang in launch_server (before argparse), the engine and the scheduler.
[project.entry-points."sglang.srt.plugins"]
voicing_convo = "voicing_runtime.register:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voicing_runtime = ["py.typed"]
